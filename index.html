<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.2/css/all.min.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <div class="menu" id="menu">
        <h3>Music Player</h3>
        <ul id="song-list">
          <li class="selected">Calming Synth Waves - Edith Downey</li>
          <li>Sequence Takeoff - Edith Downey</li>
          <li>Static Melody Keys - Edith Downey</li>
        </ul>
      </div>

  <div class="music-container" id="music-container">
    <div class="music-info">
      <h4 id="title"></h4>
      <div class="progress-container" id="progress-container">
        <div class="progress" id="progress"></div>
      </div>
    </div>

    <audio id="audio" src="music/calmingSynthWaves.mp3"></audio>


    <div class="navigation">
      <button id="prev" class="action-btn"><i class="fas fa-backward"></i></button>
      <button id="play" class="action-btn action-btn-big"><i class="fas fa-play"></i></button>
      <button id="next" class="action-btn"><i class="fas fa-forward"></i></button>
      <button id="menu-btn" class="action-btn"><i class="fas fa-bars"></i></button>
    </div>
    
    <div class="img-container">
      <img src="images/calmingSynthWaves.jpg" alt="Album Cover" id="cover" />
    </div>
  </div>
</body>
</html>
